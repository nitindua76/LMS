# Production stack — internal-network deployment (no public DNS/IP).
# Differences from docker-compose.yml (dev):
#   - api/web run from pre-built GHCR images, not bind-mounted source with
#     --reload / vite dev server.
#   - Caddy terminates TLS (self-issued "internal" cert — see Caddyfile and
#     DEPLOYMENT.md for distributing its root CA to client machines) instead
#     of every service being reachable in plaintext on its own host port.
#   - db/redis/lrs are NOT published to the host at all — only reachable
#     from other containers on the compose network. minio is the one
#     exception: it's reachable internally (minio:9000, used for every
#     actual upload/download call the api makes) AND fronted by Caddy on
#     its own TLS port (default 9002, see Caddyfile) — that second path
#     exists purely so browser-facing presigned video/PDF URLs resolve to
#     something outside the compose network can reach; MinIO's storage
#     port itself is still never exposed unproxied.
#   - No Mailpit — point SMTP_HOST/SMTP_PORT at a real internal mail relay
#     via .env.prod.
#
# Explicit project name (below) so this stack's containers/volumes/network
# never collide with docker-compose.yml (dev)'s default "lms" project when
# both run on the same machine — see DEPLOYMENT.md's "Running dev and prod
# concurrently" section. Every externally-published port is parameterized
# via .env.prod (defaults chosen to avoid both dev's own ports AND this
# host's real Windows-reserved port exclusions — confirmed via `netsh
# interface ipv4 show excludedportrange`, notably 443 and 5174 are BOTH
# excluded on this machine and would silently fail to bind).
#
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# (scripts/deploy.ps1 wraps this + pull + migrate + prune).
name: lms-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOT published by default (see the comment at the top of this file) —
    # this optional mapping exists purely for local admin/debugging access
    # (e.g. DBeaver, psql) via a DB client that supports plain TCP, not
    # HTTPS/TLS termination through Caddy. Default (5438) deliberately
    # differs from dev's published Postgres port (5437, see
    # docker-compose.yml) since both stacks can run concurrently on this
    # host — see DEPLOYMENT.md's "Running dev and prod concurrently".
    # Leave PROD_POSTGRES_PORT unset in .env.prod to skip publishing this
    # at all (comment out this ports: block if truly none is wanted).
    ports:
      - "${PROD_POSTGRES_PORT:-5438}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  content:
    image: nginx:alpine
    volumes:
      - lms_content:/usr/share/nginx/html
      - ./content-origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./content-origin:/usr/share/nginx/html/static:ro
    ports:
      # Deliberately plain HTTP and its own port, not behind Caddy: this is
      # the SCORM/cmi5 content origin, which by design never carries the
      # session cookie (see main.py's CORS comments) — it doesn't need TLS
      # the way the main app does.
      #
      # Default changed from 5174 to 8174 — 5174 is BOTH inside this host's
      # Windows-reserved TCP exclusion range AND already occupied by
      # another process (confirmed via `netsh interface ipv4 show
      # excludedportrange protocol=tcp` + `Get-NetTCPConnection`), so it
      # would silently fail to bind here regardless of dev/prod coexistence.
      - "${PROD_CONTENT_PORT:-8174}:80"
    restart: unless-stopped

  lrs:
    image: python:3.11-slim
    working_dir: /app
    # Installs its deps at container *start* time (not build time) and only
    # ever talks to PyPI (external), never another compose service by
    # hostname — same as docker-compose.yml (dev)'s lrs service, and it
    # needs the identical proxy passthrough for the identical reason: this
    # network requires an outbound HTTP(S) proxy to reach the public
    # internet at all. Confirmed via a real deploy attempt without this —
    # pip failed with "Temporary failure in name resolution" trying to
    # resolve pypi.org, blocking lrs's healthcheck and, transitively (via
    # depends_on), api/web/caddy from ever starting.
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    command: >
      sh -c "pip install fastapi uvicorn --quiet --no-cache-dir && uvicorn main:app --host 0.0.0.0 --port 9090"
    volumes:
      - ./mock-lrs:/app
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      # Defaults changed from 7881 / 55000-55100 to 8781 / 56000-56100 —
      # docker-compose.yml (dev) already publishes 7881 and the full
      # 55000-55100 UDP range directly on this same host; reusing either
      # here would fail to bind (or worse, silently bind to whichever
      # stack started last) if both run concurrently. See
      # DEPLOYMENT.md's "Running dev and prod concurrently" section.
      - "${PROD_LIVEKIT_RTC_TCP_PORT:-8781}:${PROD_LIVEKIT_RTC_TCP_PORT:-8781}"   # RTC over TCP (fallback)
      # NOTE: built from LIVEKIT_RTC_PORT_RANGE_START/_END (the existing,
      # already-established .env.prod vars — see .env.prod.example), not a
      # single combined var. The previous version of this line read
      # ${LIVEKIT_RTC_PORT_RANGE}, which .env.prod(.example) never actually
      # defines, so it always silently fell back to the hardcoded default
      # regardless of what was configured there. Fixed here.
      #
      # Host and container ports MUST match exactly (both sides of the
      # colon identical) — LiveKit advertises this same port number to
      # clients as the ICE candidate address (see livekit.prod.yaml.template's
      # node_ip comment); an asymmetric host:container mapping here would
      # make LiveKit tell clients to connect to a port that isn't actually
      # the one Docker published, breaking media negotiation silently.
      - "${LIVEKIT_RTC_PORT_RANGE_START:-56000}-${LIVEKIT_RTC_PORT_RANGE_END:-56100}:${LIVEKIT_RTC_PORT_RANGE_START:-56000}-${LIVEKIT_RTC_PORT_RANGE_END:-56100}/udp"
      # Signaling port (default 8780, see Caddyfile) intentionally NOT
      # published directly here — Caddy terminates TLS for it and reaches
      # it over the internal compose network instead.
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-you/lms}-api:${IMAGE_TAG:-latest}
    env_file:
      - .env.prod
    # Docker's default embedded DNS forwards to public resolvers, which
    # have no record of internal-only ONGC hostnames like
    # appserver1.ongc.co.in's SSO/Employee API — that only resolves
    # through the corporate AD DNS server. Same fix as docker-compose.yml
    # (dev)'s api service, for the identical reason — confirmed necessary
    # via a real login attempt that failed with httpx.ProxyError once the
    # env vars below were cleared (see that comment), then succeeded once
    # this DNS override was added too.
    dns:
      - ${DNS_SERVER_1:-10.205.55.247}
      - ${DNS_SERVER_2:-10.205.55.252}
    environment:
      # env_file above loads .env.prod wholesale, which also includes
      # HTTP_PROXY/HTTPS_PROXY (needed by the lrs service for pip installs
      # — see that service's comment). Without this override those leak
      # into the api container too, and httpx then tries to route SSO/
      # Employee API calls to appserver1.ongc.co.in (this very host,
      # reachable directly on the internal network) through the corporate
      # proxy — which can't resolve it (confirmed via a real failed login:
      # httpx.ProxyError: 504 Unknown Host). Same fix as docker-compose.yml
      # (dev)'s api service, for the identical reason.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # MUST match the minio service's real MINIO_ROOT_USER/PASSWORD below
      # — api/app/config.py's MINIO_ACCESS_KEY/MINIO_SECRET_KEY defaults
      # are "lmsadmin"/"lmspassword" (dev's convenience credentials), and
      # without this explicit passthrough api silently authenticated
      # against MinIO with those wrong defaults instead of whatever real
      # MINIO_ROOT_USER/PASSWORD is set in .env.prod. Confirmed via a real
      # failed upload: "InvalidAccessKeyId — The Access Key Id you
      # provided does not exist in our records."
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_ENDPOINT: ${INTERNAL_HOSTNAME}:${PROD_MINIO_PUBLIC_PORT:-9002}
      CONTENT_ORIGIN: http://${INTERNAL_HOSTNAME}:${PROD_CONTENT_PORT:-8174}
      API_EXTERNAL_URL: https://${INTERNAL_HOSTNAME}:${PROD_HTTPS_PORT:-8543}
      LRS_ENDPOINT: http://lrs:9090
      STORAGE_BACKEND: minio
      LIVEKIT_URL: wss://${INTERNAL_HOSTNAME}:${PROD_LIVEKIT_WSS_PORT:-8780}
      LIVEKIT_SERVER_URL: http://livekit:7880
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "strict"
      CORS_ORIGINS: https://${INTERNAL_HOSTNAME}:${PROD_HTTPS_PORT:-8543}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      lrs:
        condition: service_healthy
      livekit:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped

  web:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-you/lms}-web:${IMAGE_TAG:-latest}
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      # Defaults changed from 443/7880 to 8543/8780 — port 443 is inside
      # this host's Windows-reserved TCP exclusion range (confirmed via
      # `netsh interface ipv4 show excludedportrange protocol=tcp`) and
      # Docker Desktop cannot bind it here at all, dev/prod coexistence
      # aside; 7880 collides with dev's own LiveKit-signaling port. See
      # DEPLOYMENT.md's "Running dev and prod concurrently" section.
      - "${PROD_HTTPS_PORT:-8543}:${PROD_HTTPS_PORT:-8543}"
      - "${PROD_LIVEKIT_WSS_PORT:-8780}:${PROD_LIVEKIT_WSS_PORT:-8780}"   # LiveKit signaling (wss://) — TLS terminated here, proxied to livekit:7880 plain ws
      - "${PROD_MINIO_PUBLIC_PORT:-9002}:${PROD_MINIO_PUBLIC_PORT:-9002}"   # MinIO presigned video/PDF URLs (https://) — TLS terminated here, proxied to minio:9000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ssl:/etc/caddy/ssl:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      INTERNAL_HOSTNAME: ${INTERNAL_HOSTNAME}
      PROD_HTTPS_PORT: ${PROD_HTTPS_PORT:-8543}
      PROD_LIVEKIT_WSS_PORT: ${PROD_LIVEKIT_WSS_PORT:-8780}
      PROD_MINIO_PUBLIC_PORT: ${PROD_MINIO_PUBLIC_PORT:-9002}
    depends_on:
      - web
      - api
      - livekit
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  lms_content:
  caddy_data:
  caddy_config:
