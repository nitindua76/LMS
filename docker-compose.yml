services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmspassword}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lmsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lmspassword}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  content:
    image: nginx:alpine
    volumes:
      - lms_content:/usr/share/nginx/html
      - ./content-origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./content-origin:/usr/share/nginx/html/static:ro
    # No host port published here — the `nginx` TLS service (below) is the
    # only entry point for this container now, terminating https:// on 5175
    # and forwarding plain http internally. See nginx/nginx.conf.
    expose:
      - "80"

  lrs:
    image: python:3.11-slim
    working_dir: /app
    # Unlike api/web, this service installs its deps at container *start*
    # time (not build time), and only ever talks to PyPI (external) — never
    # another compose service by hostname — so it's safe to set the proxy as
    # a normal runtime env var here, unlike api/Dockerfile's build-only ARGs.
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    command: >
      sh -c "pip install fastapi uvicorn --quiet --no-cache-dir && uvicorn main:app --host 0.0.0.0 --port 9090"
    volumes:
      - ./mock-lrs:/app
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-dev-livekit-secret-replace-in-production}"
    ports:
      # 7880 (signaling) intentionally NOT published here — the `nginx` TLS
      # service terminates wss:// on 7880 instead and forwards plain ws
      # internally (see nginx/nginx.conf); browsers require a secure
      # context for navigator.mediaDevices (camera/mic), so signaling must
      # be wss://, not ws://.
      - "7881:7881"   # RTC over TCP (fallback when UDP is blocked) — raw media, not proxied
      - "55000-55100:55000-55100/udp"  # raw media — not proxied, TLS doesn't apply to it
    expose:
      - "7880"
    depends_on:
      redis:
        condition: service_healthy
    # Production: put this behind a TLS-terminating reverse proxy (wss://),
    # enable turn.enabled in livekit.yaml with a real domain + cert, and run
    # 2+ replicas — the redis-backed config above already supports that
    # without any change to this file beyond `deploy.replicas` / a second
    # service block.

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    env_file:
      - .env
    # Docker's default embedded DNS (127.0.0.11) here forwards to public
    # resolvers (8.8.8.8/8.8.4.4), which have no record of internal-only
    # ONGC hostnames like appserver1.ongc.co.in's SSO/Employee API — that
    # only resolves through the corporate AD DNS server. Without this the
    # container gets "Temporary failure in name resolution" on every SSO/
    # Employee API call. Point it at the same internal DNS server(s) the
    # host itself uses (see `ipconfig`/`Get-DnsClientServerAddress` on the
    # host — adjust DNS_SERVER_1/2 in .env if this host's DNS servers ever
    # change).
    dns:
      - ${DNS_SERVER_1:-10.205.55.247}
      - ${DNS_SERVER_2:-10.205.55.252}
    environment:
      # env_file above loads .env wholesale, which ALSO includes
      # HTTP_PROXY/HTTPS_PROXY/NO_PROXY (needed at *build* time — see
      # api/Dockerfile's ARGs). Without this override those leak into the
      # running container too, and httpx then tries to route calls to
      # appserver1.ongc.co.in (this very host, reachable directly on the
      # internal network) through the corporate proxy — which rejects the
      # tunnel (seen in practice: "403 Tunnel or SSL Forbidden"). Clearing
      # them here restores the documented intent: this service never uses
      # a proxy at runtime, only api/web's Dockerfiles do at build time.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lmspassword}@db:5432/${POSTGRES_DB:-lms}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # Read from .env (via env_file above) rather than hardcoded here —
      # both now point at the nginx TLS service under one hostname. Don't
      # hardcode these back; an inline `environment:` value here would
      # silently override whatever's set in .env.
      CONTENT_ORIGIN: ${CONTENT_ORIGIN}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      SCORM_TOKEN_SECRET: ${SCORM_TOKEN_SECRET:-dev-scorm-secret}
      LRS_ENDPOINT: http://lrs:9090
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/lms-content
      # The address the BROWSER connects to directly for LiveKit's signaling
      # (wss:// via the nginx TLS service, required for navigator.mediaDevices
      # to work at all) and, via published UDP/TCP ports, media — never
      # localhost, since that resolves to whatever machine the browser itself
      # runs on. Defaults to this host's DNS name/LAN IP via LIVEKIT_HOST in
      # .env; set that to whatever hostname/IP remote machines can actually
      # reach this host at (see livekit/livekit.yaml's node_ip comment for
      # the matching media-negotiation setting).
      LIVEKIT_URL: wss://${LIVEKIT_HOST:-localhost}:7880
      LIVEKIT_SERVER_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev-livekit-secret-replace-in-production}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    # No host port published here — the `nginx` TLS service terminates
    # https:// on 8000 and forwards plain http internally. See nginx/nginx.conf.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      lrs:
        condition: service_healthy
      livekit:
        condition: service_started
    volumes:
      - ./api:/app
      - lms_content:/data/lms-content
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    env_file:
      - .env
    environment:
      # See the api service's identical override above — env_file leaks
      # the build-only proxy vars in otherwise; clear them here too.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      VITE_API_URL: http://api:8000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    # No host port published here — the `nginx` TLS service terminates
    # https:// on 5173 and forwards plain http/ws (HMR) internally. See
    # nginx/nginx.conf.
    expose:
      - "5173"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  # Terminates TLS for web/api/content/livekit-signaling under one hostname
  # (appserver1.ongc.co.in) using the *.ongc.co.in cert in ./ssl — needed
  # because navigator.mediaDevices (camera/mic for live sessions) only works
  # in a secure context. See nginx/nginx.conf for the per-port routing and
  # why this collapses the SCORM content origin onto the same hostname
  # (accepted tradeoff — no second DNS name available for this host).
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "5173:5173"
      - "8000:8000"
      - "5175:5175"
      - "7880:7880"
    depends_on:
      - web
      - api
      - content
      - livekit

volumes:
  postgres_data:
  redis_data:
  minio_data:
  lms_content:
