# TLS termination for local/LAN dev+testing — all four ports below carry the
# same wildcard cert (*.ongc.co.in) and proxy in plain HTTP/WS to each
# service over the internal compose network. This exists because browsers
# only allow camera/mic (navigator.mediaDevices, needed for live sessions)
# in a "secure context" — https://, or literally localhost — so testing
# from another machine over plain http:// silently breaks that API even
# though everything else works.
#
# LiveKit's actual media (UDP 55000-55100, TCP 7881 fallback) is NOT proxied
# here — WebRTC media doesn't go through a regular HTTP/WS reverse proxy;
# only the wss:// signaling connection (port 7880) does. Those two ports stay
# published directly from the livekit service (see docker-compose.yml).
#
# Everything here shares one hostname (appserver1.ongc.co.in) instead of a
# separate one for the SCORM/cmi5 content origin — see the comment on
# CONTENT_ORIGIN in .env for why that's a deliberate, accepted tradeoff for
# this test setup (it removes the SameSite cookie isolation described in
# README.md; do not carry this single-origin setup into a real deployment).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 550M; # headroom above MAX_VIDEO_UPLOAD_MB (500) for admin content uploads

    # Shared by the web and livekit server blocks below to upgrade to a
    # websocket connection (Vite HMR, LiveKit signaling) when requested,
    # and otherwise proxy as a normal HTTP request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── web: Vite dev server (main app + HMR websocket) ──────────────────────
    server {
        listen 5173 ssl;
        server_name appserver1.ongc.co.in;

        ssl_certificate     /etc/nginx/ssl/ONGC2526.crt;
        ssl_certificate_key /etc/nginx/ssl/ONGC2526KEY.decrypted.key;

        location / {
            proxy_pass http://web:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── api: FastAPI ──────────────────────────────────────────────────────────
    # Browser hits this directly (not via the Vite proxy) for SCORM/cmi5
    # launch URLs opened at the content origin — see API_EXTERNAL_URL in .env.
    server {
        listen 8000 ssl;
        server_name appserver1.ongc.co.in;

        ssl_certificate     /etc/nginx/ssl/ONGC2526.crt;
        ssl_certificate_key /etc/nginx/ssl/ONGC2526KEY.decrypted.key;

        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── content: SCORM/cmi5 package origin (nginx:alpine) ────────────────────
    server {
        listen 5175 ssl;
        server_name appserver1.ongc.co.in;

        ssl_certificate     /etc/nginx/ssl/ONGC2526.crt;
        ssl_certificate_key /etc/nginx/ssl/ONGC2526KEY.decrypted.key;

        location / {
            proxy_pass http://content:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── livekit: signaling only (wss://) ───────────────────────────────────────
    server {
        listen 7880 ssl;
        server_name appserver1.ongc.co.in;

        ssl_certificate     /etc/nginx/ssl/ONGC2526.crt;
        ssl_certificate_key /etc/nginx/ssl/ONGC2526KEY.decrypted.key;

        location / {
            proxy_pass http://livekit:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
